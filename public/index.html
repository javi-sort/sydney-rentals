<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney Rentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="header-title">Sydney <span>Rentals</span></h1>
  <span class="listing-count" id="count">Loading...</span>
  <button id="refresh-btn" class="listing-count" style="cursor:pointer;background:none;border:1px solid var(--border);border-radius:4px;padding:2px 10px;">Check status</button>
</header>
<main>
  <div class="grid" id="grid">
    <!-- skeleton placeholders -->
    <div class="card" style="opacity:0.5">
      <div class="card-body" style="gap:14px">
        <div class="skeleton" style="height:28px;width:55%"></div>
        <div class="skeleton" style="height:16px;width:85%"></div>
        <div class="skeleton" style="height:14px;width:40%"></div>
      </div>
      <div class="card-footer"><div class="skeleton" style="height:14px;width:40%"></div></div>
    </div>
    <div class="card" style="opacity:0.35">
      <div class="card-body" style="gap:14px">
        <div class="skeleton" style="height:28px;width:48%"></div>
        <div class="skeleton" style="height:16px;width:78%"></div>
        <div class="skeleton" style="height:14px;width:35%"></div>
      </div>
      <div class="card-footer"><div class="skeleton" style="height:14px;width:33%"></div></div>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
