<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                width: 300px;
                padding: 16px;
                font-family: sans-serif;
            }
            h2 {
                margin: 0 0 12px;
                font-size: 16px;
            }
            .field {
                margin-bottom: 8px;
                font-size: 14px;
            }
            .label {
                font-weight: bold;
            }
            .contacts-group {
                margin-top: 4px;
                border: 1px solid #e5e7eb;
                border-radius: 6px;
                padding: 8px 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .contact-entry {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .contact-entry + .contact-entry {
                padding-top: 8px;
                border-top: 1px solid #f3f4f6;
            }
            button {
                margin-top: 12px;
                width: 100%;
                padding: 10px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }
            #status {
                margin-top: 10px;
                font-size: 13px;
                color: green;
            }
        </style>
    </head>
    <body>
        <h2>Save this listing?</h2>
        <div class="field"><span class="label">Address:</span> <span id="address">Loading...</span></div>
        <div class="field"><span class="label">Suburb:</span> <span id="suburb">Loading...</span></div>
        <div class="field"><span class="label">Price:</span> <span id="price">Loading...</span></div>
        <div class="field"><span class="label">Beds:</span> <span id="beds">Loading...</span></div>
        <div class="field"><span class="label">Baths:</span> <span id="baths">Loading...</span></div>
        <div class="field"><span class="label">Car spaces:</span> <span id="carSpaces">Loading...</span></div>
        <div class="field"><span class="label">Contacts</span></div>
        <div id="contacts">Loading...</div>
        <button id="save-btn">Save Listing</button>
        <div id="status"></div>
        <script src="popup.js"></script>
    </body>
</html>
